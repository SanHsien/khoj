version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    # Keep the reviewed 0.3.x LangChain family until the server and embedding
    # paths can be tested together; see docs/DECISIONS.md (2026-09-29).
    ignore:
      - dependency-name: "langchain-text-splitters"
        versions: [">=1.0.0"]
      # Held majors, see docs/DECISIONS.md (2026-09-30): no product tests run here.
      - dependency-name: "pyjson5"
        versions: [">=2.0.0"]
      - dependency-name: "gunicorn"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
      - dependency-name: "twilio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest-asyncio"
        versions: [">=0.22.0"]
      - dependency-name: "sentence-transformers"
        versions: [">=4.0.0"]
      - dependency-name: "markdown-it-py"
        versions: [">=4.0.0"]
      - dependency-name: "pgvector"
        versions: [">=0.3.0"]
      - dependency-name: "torch"
        versions: [">=2.7.0"]
      - dependency-name: "transformers"
        versions: [">=5.0.0"]
      - dependency-name: "langchain"
        versions: [">=1.0.0"]
      - dependency-name: "langchain-core"
        versions: [">=1.0.0"]
      - dependency-name: "langchain-community"
        versions: [">=0.4.0"]
      - dependency-name: "langsmith"
        versions: [">=0.8.6"]
      - dependency-name: "magika"
        versions: [">=0.6.0"]
      - dependency-name: "openai"
        versions: [">=3.0.0"]
      - dependency-name: "websockets"
        versions: [">=14.0"]
      - dependency-name: "markdownify"
        versions: [">=1.0.0"]
      - dependency-name: "cron-descriptor"
        versions: [">=2.0.0"]
      - dependency-name: "anthropic"
        versions: [">=0.76.0"]
      - dependency-name: "django-unfold"
        versions: [">=0.43.0"]
      - dependency-name: "anthropic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "resend"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django-phonenumber-field"
        update-types: ["version-update:semver-major"]
    # Minor and patch updates arrive as one PR per group; with one PR per
    # package the 5-PR limit refilled faster than the backlog could be reviewed.
    # Majors stay separate so each can be judged on its own.
    groups:
      development-dependencies:
        dependency-type: "development"
      production-minor-and-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    groups:
      github-actions:
        patterns: ["*"]
