version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    # Keep the reviewed 0.3.x LangChain family until the server and embedding
    # paths can be tested together; see docs/DECISIONS.md (2026-09-29).
    ignore:
      - dependency-name: "langchain-text-splitters"
        versions: [">=1.0.0"]
      # Held majors, see docs/DECISIONS.md (2026-09-30): no product tests run here.
      - dependency-name: "pyjson5"
        versions: [">=2.0.0"]
      - dependency-name: "magika"
        versions: [">=1.0.0"]
      - dependency-name: "gunicorn"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
      - dependency-name: "twilio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest-asyncio"
        update-types: ["version-update:semver-major"]
    groups:
      development-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    groups:
      github-actions:
        patterns: ["*"]
